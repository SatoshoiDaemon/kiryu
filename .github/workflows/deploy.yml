name: Deploy to Square Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: squarecloud-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Deploy and restart Square Cloud app
        uses: squarecloudofc/github-action@v2
        with:
          token: ${{ secrets.SQUARECLOUD_API_TOKEN }}
          command: commit 09e5147f116d46eba2ff92ed5a583dd0 --restart
